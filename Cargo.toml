[package]
name = "ultimate_macro"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.13.4", features = ["json"] }
serde = {version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
rusqlite = {version = "0.40.1", features = ["bundled"] }
chrono = "0.4.45"
log = "0.4"
simplelog = "0.12"
slint = "1.17.0"

[build-dependencies]
slint-build = "1.17.0"