[package]
name = "ultimate_macro"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
reqwest = { version = "0.13.4", features = ["json"] }
serde = {version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
rusqlite = {version = "0.40.2", features = ["bundled"] }
chrono = "0.4.45"
log = "0.4"
simplelog = "0.12"

[build-dependencies]
slint-build = "1.17.0"

[target.'cfg(not(target_os = "android"))'.dependencies]
slint = "1.17.0"

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.17.0", default-features = false, features = ["std", "compat-1-2", "backend-android-activity-06"] }
jni = "0.21.1"
rustls-platform-verifier = "0.7.0"
jni-platform = { package = "jni", version = "0.22.4" }
