import groovy.json.JsonSlurper

plugins { id 'com.android.application' }

android {
    namespace 'com.rainer.ultimatemacro'
    compileSdk 35
    defaultConfig {
        applicationId 'com.rainer.ultimatemacro'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.jniLibs.srcDirs = ['src/main/jniLibs']
}

// Locate the TLS companion that belongs to the locked Rust dependency version.
// Android HTTPS verification needs these JVM classes as well as native Rust code.
def cargoMetadata = providers.exec {
    workingDir rootProject.projectDir.parentFile
    commandLine 'cargo', 'metadata', '--format-version', '1', '--locked',
        '--filter-platform', 'aarch64-linux-android'
}.standardOutput.asText.get()
def tlsPackage = new JsonSlurper().parseText(cargoMetadata).packages.find {
    it.name == 'rustls-platform-verifier-android'
}
repositories {
    google()
    mavenCentral()
    maven {
        url = new File(new File(tlsPackage.manifest_path).parentFile, 'maven')
        metadataSources { mavenPom(); artifact() }
    }
}

dependencies {
    implementation "rustls:rustls-platform-verifier:${tlsPackage.version}"
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    // ZXing 4.3.0's published POM omits its implementation dependencies.
    // Without these, CaptureActivity crashes when opening camera permissions.
    implementation 'androidx.core:core:1.6.0'
    implementation 'androidx.fragment:fragment:1.3.6'
}

// Build the shared Rust library before packaging; cargo-ndk uses ANDROID_NDK_HOME.
// Keep API level and ABI consistent with defaultConfig above.
tasks.register('buildRust', Exec) {
    workingDir rootProject.projectDir.parentFile
    // cargo-ndk sets ANDROID_PLATFORM to minSdk; Slint's Java helper needs compileSdk.
    environment 'ANDROID_JAR', new File(android.sdkDirectory, 'platforms/android-35/android.jar').absolutePath
    commandLine 'cargo', 'ndk', '-t', 'arm64-v8a', '--platform', '26',
        '-o', 'android/app/src/main/jniLibs', 'build', '--lib', '--release', '--locked'
}
tasks.named('preBuild').configure { dependsOn 'buildRust' }
